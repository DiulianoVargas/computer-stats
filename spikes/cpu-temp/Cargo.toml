[package]
name = "cpu-temp-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
