[package]
name = "computer-stats"
version = "0.5.1"
edition = "2024"
publish = false
description = "Lightweight Windows tray visualizer for Metrics and Processes"
authors = ["Diuliano Vargas"]
license = "MIT"
repository = "https://github.com/DiulianoVargas/computer-stats"

# The app logic lives in the library so `cargo test` runs it without the elevation manifest,
# which is embedded only in the binary (research R6).
[lib]
path = "src/lib.rs"

[[bin]]
name = "computer-stats"
path = "src/main.rs"
test = false

[dependencies]
# UI toolkit (ADR-0001). Software renderer only (Constitution V). `unstable-winit-030` (no extra
# crates) gives the Panel's winit attributes and focus events (research R4).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
# Win32 FFI for the Tray Icon, Panel window tweaks and Metric sources (Constitution III: used only in src/platform/).
# Wdk_Graphics_Direct3D: D3DKMT GPU statistics in gdi32 (ADR-0003).
# Wdk_System_SystemInformation: process enumeration for the Processes View (003 research R1).
# Win32_UI_Accessibility: `SetWinEventHook` for the Desktop Widget on Show desktop (005 research R4).
windows = { version = "0.62", default-features = false, features = [
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Compiles ui/*.slint into Rust at build time.
slint-build = "1.18"
# Embeds the app icon and version info (rc.exe from the Windows SDK); build-time only.
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Size over speed: the empty Slint skeleton is 8.2 MiB at opt-level 3, 7.3 MiB at "s" (exe budget 10 MB).
opt-level = "s"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
